<div class="modal fade" id="app-confirm-modal" tabindex="-1" role="dialog" aria-labelledby="app-confirm-title" aria-describedby="app-confirm-message" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered" role="document">
    <div class="modal-content">
      <div class="modal-header">
        <h4 class="modal-title" id="app-confirm-title">Confirm action</h4>
        <button type="button" class="btn-close" data-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body"><p id="app-confirm-message"></p></div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" id="app-confirm-cancel" data-dismiss="modal">Cancel</button>
        <button type="button" class="btn btn-danger no-spinner" id="app-confirm-accept">Confirm</button>
      </div>
    </div>
  </div>
</div>

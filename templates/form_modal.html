<div class="modal fade" id="app-form-modal" role="dialog" tabindex="-1"
     aria-labelledby="app-form-title" aria-describedby="app-form-status" aria-hidden="true">
  <div class="modal-dialog modal-lg modal-dialog-centered modal-dialog-scrollable" role="document">
    <div class="modal-content">
      <div class="modal-header">
        <h4 class="modal-title" id="app-form-title">Edit</h4>
        <button type="button" class="btn-close" data-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <p id="app-form-status" role="status" aria-live="polite"></p>
        <div id="app-form-fields"></div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-dismiss="modal">Cancel</button>
        <button type="submit" class="btn btn-success no-spinner" id="app-form-save" form="app-modal-form" disabled>Save</button>
      </div>
    </div>
  </div>
</div>

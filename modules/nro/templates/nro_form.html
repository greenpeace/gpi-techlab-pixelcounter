{% extends "modal_form_base.html" if request.headers.get("X-Modal-Form") == "1" else "base.html" %}

{% block content %}
<div class="page-title"><h3>{{ 'Edit' if nro else 'Add' }} NRO</h3></div>
<div class="container-fluid">
  <form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="form-group">
      <label for="nro-name">NRO name</label>
      <input type="text" id="nro-name" name="name" required class="form-control"
             value="{{ nro.name if nro else '' }}">
    </div>
    <div class="form-check form-switch my-3">
      <input type="checkbox" role="switch" class="form-check-input" id="nro-active"
             name="active" value="on" {% if not nro or nro.active %}checked{% endif %}>
      <label class="form-check-label" for="nro-active">Active</label>
    </div>
    <a href="{{ url_for('nroblue.nro_list') }}" class="btn btn-secondary">Cancel</a>
    <button type="submit" class="btn btn-success">Save</button>
  </form>
</div>
{% endblock content %}

{% extends "base.html" %}

{% block content %}

<!-- page content -->
<div class="page-title">
  <div class="title_left">
    <h3>Add <small>a counter</small></h3>
  </div>
</div>

<div class="clearfix"></div>

<div class="container-fluid">
  <form action="/createlist" method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <hr>
    <div class="form-group">
      <label for="name">Counter Name</label>
      <input type="text" name="name" class="form-control" required
        placeholder="The counter name also the id for the counter - has to be one single word with no spaces and lowercase"></input>
    </div>
    <div class="form-group">
      <label for="nro">NRO</label>
      <select name="nro" class="form-control" required>
        <option value="">Select NRO</option>
        {% for nro in nros %}
        <option value="{{ nro }}">{{ nro }}</option>
        {% endfor %}
      </select>
    </div>
    <div class="form-group">
      <label for="count">Count</label>
      <input type="number" class="form-control" name="count" required value="0" placeholder="Start with 0"></input>
    </div>
    <div class="form-group">
      <label for="url">URL</label>
      <input type="url" class="form-control" name="url" required placeholder="URL where counter used"></input>
    </div>
    <div class="form-group">
      <label for="type">Type</label>
      <select id="type" name="type" class="form-control">
        <option selected>Select Type</option>
        <option value="global">Global</option>
        <option value="local">Local</option>
      </select>
    </div>
    <hr>
    <div class="form-group">
      <label for="contactpoint">Contact</label>
      <input type="text" class="form-control" name="contactpoint" required
        placeholder="Who to contact about the counter"></input>
    </div>
    <div class="form-group">
      <label for="campaign">Campaign</label>
      <input type="text" class="form-control" name="campaign" required
        placeholder="Name of the campaign for this counter"></input>
    </div>
    <div class="form-group">
      <label for="assigned_users">Assigned Users (Multi-select)</label>
      <select name="assigned_users" class="form-control" multiple style="height: 150px;">
        {% for user in users %}
        <option value="{{ user.uuid }}">{{ user.name }}</option>
        {% endfor %}
      </select>
      <small class="form-text text-muted">Hold down Ctrl (Windows) or Command (Mac) to select multiple users.</small>
    </div>
    <br>
    <br>
    <input type="submit" class="btn btn-primary" value="Add"></input>
  </form>
</div>
<hr>

{% endblock content %}

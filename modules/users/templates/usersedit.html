{% extends "modal_form_base.html" if request.headers.get("X-Modal-Form") == "1" else "base.html" %}

{% block content %}

<!-- page content -->
<div class="page-title">
  <div class="title_left">
    <h3>Edit user</h3>
  </div>
</div>

<div class="clearfix"></div>
<form action="/usersupdate" method="post">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <input type="hidden" name="id" value="{{ users.id }}"></input>
  <hr>

  <div class="form-group">
    <label for="id">First Name</label>
    <input type="text" name="given_name" class="form-control" value="{{ users.given_name }}"></input>
  </div>
  <hr>
  <div class="form-group">
    <label for="clastname">Last Name</label>
    <input type="text" class="form-control" name="family_name" value="{{ users.family_name }}"></input>
  </div>
  <hr>
  <div class="form-group">
    <label for="email">Email</label>
    <input type="email" class="form-control" name="email" value="{{ users.email }}"></input>
  </div>
  <div class="form-group">
    <label for="phone">Phone</label>
    <input type="phone" class="form-control" name="phone" value="{{ users.phone }}"></input>
  </div>
  <div class="form-group">
    <label for="phone">Designation</label>
    <input type="text" class="form-control" name="designation" value="{{ users.designation }}"></input>
  </div>
  <div class="form-group">
    <label for="nro">NRO (National/Regional Office)</label>
    <select class="form-control" name="nro" id="nro">
      <option value="">-- Select NRO --</option>
      {% if nros %}
      {% for nro_n in nros %}
      <option value="{{ nro_n }}" {% if users.nro==nro_n %}selected{% endif %}>{{ nro_n }}</option>
      {% endfor %}
      {% endif %}
    </select>
  </div>
  <div class="form-group">
    <label for="role">Role</label>
    <select class="form-control" name="role" id="role">
      <option value="Administrator" {% if users.role=="Administrator" %}selected{% endif %}>Administrator</option>
      <option value="User" {% if users.role=="User" %}selected{% endif %}>User</option>
    </select>
  </div>
    <div class="form-group">
      <label for="assigned_counter_ids">Assigned Counters (Hold Ctrl/Cmd to select multiple)</label>
      <select class="form-control" name="assigned_counter_ids" id="assigned_counter_ids" multiple size="8">
        {% if counters %}
        {% for counter in counters %}
        <option value="{{ counter.id }}" {% if counter.is_assigned %}selected{% endif %}>{{ counter.name }}</option>
        {% endfor %}
        {% else %}
        <option value="" disabled>No counters available</option>
        {% endif %}
      </select>
      <small class="form-text text-muted">Select counters to assign to this user. Unselecting a counter will remove its
        assignment.</small>
    </div>

    <div class="form-group">
      <label for="assigned_apikey_ids">Assigned API Keys (Hold Ctrl/Cmd to select multiple)</label>
      <select class="form-control" name="assigned_apikey_ids" id="assigned_apikey_ids" multiple size="5">
        {% if apikeys %}
        {% for key in apikeys %}
        <option value="{{ key.id }}" {% if key.is_assigned %}selected{% endif %}>{{ key.mask }} (Created: {{
          key.created_at }})</option>
        {% endfor %}
        {% else %}
        <option value="" disabled>No API keys available</option>
        {% endif %}
      </select>
      <small class="form-text text-muted">Select API keys to assign/transfer to this user.</small>
    </div>
    <br>
    <br>
    <input class="btn btn-sm btn-success" type="submit" value="Update"></input>
</form>
{% endblock content %}
